name: Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target env (dev|staging|prod)"
        required: true
        default: "staging"

concurrency:
  group: deploy-${{ github.event.inputs.env }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm install -g aws-cdk@2
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: cdk diff
        run: cdk diff --context env=${{ github.event.inputs.env }}
      - name: cdk deploy
        run: cdk deploy --all --require-approval never --context env=${{ github.event.inputs.env }}
        env:
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
