[project]
name = "tracefind-backend"
version = "0.1.0"
description = "TraceFind — Smart Lost & Found System backend"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "moto[dynamodb,ses,cognito-idp]>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
